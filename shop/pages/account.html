<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Account — ARCANE SHOP</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/style.css" />
<style>
  .page-header { text-align: center; padding: 4rem 2rem 2rem; border-bottom: 1px solid var(--border); }
  .page-header h1 { font-size: clamp(2rem, 4vw, 3rem); font-weight: 800; }
  .page-header p { color: var(--muted); margin-top: .75rem; }
  .account-wrap { max-width: 400px; margin: 0 auto; padding: 2.5rem 2rem; }
  .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1.75rem; }
  .auth-card h2 { font-size: 1rem; font-weight: 800; margin-bottom: 1.25rem; text-align: center; }
  .auth-tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 1.25rem; }
  .auth-tab { flex: 1; padding: .6rem; background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--muted); cursor: pointer; font-family: 'Syne', sans-serif; font-weight: 700; font-size: .875rem; transition: all .2s; }
  .auth-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .auth-form { display: flex; flex-direction: column; gap: 1rem; }
  .auth-form .form-group label { font-size: .75rem; }
  .auth-divider { text-align: center; color: var(--muted); font-size: .8rem; margin: .5rem 0; position: relative; }
  .auth-divider::before, .auth-divider::after { content: ''; position: absolute; top: 50%; width: 35%; height: 1px; background: var(--border); }
  .auth-divider::before { left: 0; } .auth-divider::after { right: 0; }
  .social-auth { display: flex; gap: .5rem; }
  .social-auth .btn { flex: 1; justify-content: center; }
</style>
</head>
<body>
<div class="page-header">
  <h1>My Account</h1>
  <p>Sign in or create an account to manage orders, wishlist, and more.</p>
  <a href="../index.html" class="btn btn-ghost btn-sm" style="margin-top:1.5rem">← Back to Shop</a>
</div>
<div class="account-wrap">
  <div class="auth-card">
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchAuthTab(this,'signin')">Sign In</button>
      <button class="auth-tab" onclick="switchAuthTab(this,'register')">Register</button>
    </div>

    <div id="auth-signin" class="auth-form">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" placeholder="you@email.com" class="input-field" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" placeholder="••••••••" class="input-field" />
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <label style="display:flex;align-items:center;gap:.4rem;font-size:.8rem;color:var(--muted);cursor:pointer">
          <input type="checkbox" style="accent-color:var(--accent)" /> Remember me
        </label>
        <a href="#" style="font-size:.8rem;color:var(--accent);text-decoration:none" onclick="showToast('Password reset coming soon!','success')">Forgot password?</a>
      </div>
      <button class="btn btn-primary btn-full" onclick="showToast('Account portal coming soon!','success')">Sign In</button>
      <div class="auth-divider">or continue with</div>
      <div class="social-auth">
        <button class="btn btn-secondary" onclick="showToast('Google sign-in coming soon!','success')">G</button>
        <button class="btn btn-secondary" onclick="showToast('Apple sign-in coming soon!','success')">🅰</button>
        <button class="btn btn-secondary" onclick="showToast('GitHub sign-in coming soon!','success')">⌂</button>
      </div>
    </div>

    <div id="auth-register" class="auth-form" style="display:none">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" placeholder="Jane Smith" class="input-field" />
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" placeholder="you@email.com" class="input-field" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" placeholder="Create a strong password" class="input-field" />
      </div>
      <label style="display:flex;align-items:flex-start;gap:.5rem;font-size:.8rem;color:var(--muted);cursor:pointer">
        <input type="checkbox" style="accent-color:var(--accent);margin-top:2px" /> I agree to the Terms of Service and Privacy Policy
      </label>
      <button class="btn btn-primary btn-full" onclick="showToast('Registration coming soon!','success')">Create Account</button>
      <p style="font-size:.75rem;color:var(--muted);text-align:center">Already have an account? <a href="#" style="color:var(--accent)" onclick="switchAuthTab(document.querySelector('.auth-tab'),'signin')">Sign In</a></p>
    </div>
  </div>
</div>

<script>
function switchAuthTab(el, tab) {
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('auth-signin').style.display = tab === 'signin' ? '' : 'none';
  document.getElementById('auth-register').style.display = tab === 'register' ? '' : 'none';
}
function showToast(msg, type) {
  alert(msg);
}
</script>
</body>
</html>
