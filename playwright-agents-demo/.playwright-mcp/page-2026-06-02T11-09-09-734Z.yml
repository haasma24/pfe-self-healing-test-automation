      - generic [ref=e147]:
        - heading "Selecting a Framework" [level=2] [ref=e148]
        - paragraph [ref=e149]: Once you've downloaded the latest release and played around with the apps, you'll want to decide on a specific framework to try out.
        - paragraph [ref=e150]: Study the syntax required for defining models, views and (where applicable) controllers and classes in the frameworks you're interested in and try your hand at editing the code to see how it feels using it first-hand.
        - paragraph [ref=e151]: Please ensure that if you're happy with this, you do spend more time investigating the framework (including reading the official docs, the source and its complete feature list). There's often a lot more to a framework than what we present in our examples.
      - generic [ref=e152]:
